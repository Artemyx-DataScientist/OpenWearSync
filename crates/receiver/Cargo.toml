[package]
name = "openwearsync-receiver"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[features]
integration-harness = []

[[bin]]
name = "receiver_test_harness"
path = "src/bin/receiver_test_harness.rs"
required-features = ["integration-harness"]

[dependencies]
openwearsync-protocol = { path = "../protocol" }
openwearsync-security = { path = "../security" }
openwearsync-transfer-core = { path = "../transfer-core" }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tempfile = "3.27.0"

