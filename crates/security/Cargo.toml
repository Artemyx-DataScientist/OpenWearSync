[package]
name = "openwearsync-security"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[dependencies]
aes-gcm = "=0.10.3"
hkdf = "=0.12.4"
openwearsync-protocol = { path = "../protocol" }
rand = "0.8.6"
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
time = "=0.3.55"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }
