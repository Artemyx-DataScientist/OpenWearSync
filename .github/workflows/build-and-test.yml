name: build-and-test
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
      - run: cargo test --workspace --locked
      - run: cargo metadata --format-version 1 --no-deps
  windows-builds:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          link-to-sdk: true
      - name: Configure Android NDK environment
        shell: pwsh
        run: |
          $ndkPath = '${{ steps.setup-ndk.outputs.ndk-path }}'
          if (-not $ndkPath -or -not (Test-Path $ndkPath)) {
            $preinstalled = Get-ChildItem "$env:ANDROID_HOME\ndk" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
            if ($preinstalled) { $ndkPath = $preinstalled.FullName }
          }
          Write-Host "Configured NDK at $ndkPath"
          "ANDROID_NDK_HOME=$ndkPath" >> $env:GITHUB_ENV
          "ANDROID_NDK_ROOT=$ndkPath" >> $env:GITHUB_ENV
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gates/project-structure.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gates/desktop-build.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gates/android-unit.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gates/client-receiver-integration.ps1
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/gates/android-build.ps1
